# Server-only task routing. No provider/model selector in the product UI.
version: environment-model-policy-v1
batch_size: 20
batch_input_bytes: 60000
global_input_bytes: 700000
max_provider_attempts: 2
models:
  qwen: qwen-plus
  kimi: kimi-k3
  deepseek: deepseek-v4-pro
shallow:
  providers: [qwen, kimi, deepseek]
  timeout_seconds: 100
  max_output_tokens: 8192
synthesis:
  providers: [deepseek, kimi, qwen]
  timeout_seconds: 180
  max_output_tokens: 14000
deep_dive:
  providers: [deepseek, kimi, qwen]
  timeout_seconds: 180
  max_output_tokens: 12000
