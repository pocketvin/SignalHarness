# Server-only task routing. No provider/model selector in the product UI.
version: environment-model-policy-v2
batch_size: 12
batch_input_bytes: 42000
shallow_concurrency: 3
tiny_fast_path_max_changes: 4
tiny_fast_path_max_input_bytes: 24000
direction_fact_chars: 88
global_input_bytes: 450000
max_provider_attempts: 2
retry_split_min_batch: 4
models:
  qwen: qwen-plus
  kimi: kimi-k3
  deepseek: deepseek-v4-pro
shallow:
  providers: [qwen, kimi, deepseek]
  timeout_seconds: 75
  max_output_tokens: 8192
synthesis:
  providers: [deepseek, kimi, qwen]
  timeout_seconds: 180
  max_output_tokens: 14000
deep_dive:
  providers: [deepseek, kimi, qwen]
  timeout_seconds: 180
  max_output_tokens: 12000
