version: 1

score_weights:
  source_weight: 0.20
  keyword_match_score: 0.25
  project_relevance_score: 0.30
  novelty_score: 0.10
  urgency_score: 0.10
  feedback_adjustment: 0.05

agent_score_weights:
  deterministic_base: 0.70
  semantic_relevance: 0.20
  evidence_confidence: 0.10

source_weights:
  official_release: 88
  official_issue: 70
  maintainer_issue: 62
  official_blog: 78
  expert_blog: 62
  community_discussion: 50
  unverified: 20
  web_change: 60
  team_update: 75

keyword_weights:
  checkpoint: 1.2
  memory: 1.1
  skill: 1.1
  tool calling: 1.2
  structured output: 1.2
  json schema: 1.2
  provider: 1.1
  cve: 1.5
  vulnerability: 1.4
  supply chain: 1.3
  benchmark: 0.9
  evaluation: 1.0
  agent eval: 1.1
  observability: 1.1
  latency: 0.8
  mcp: 1.2
  security: 1.2

suggested_focus_keywords: []

ignore_patterns:
  - minor footer
  - typo only

category_weights:
  dependency_update: 0.94
  ecosystem_issue: 0.70
  agent_runtime_signal: 0.88
  checkpoint_persistence_signal: 1.00
  structured_output_signal: 0.92
  tool_calling_signal: 0.92
  provider_compatibility_signal: 0.90
  source_collection_signal: 0.78
  security_supply_chain: 1.00
  evaluation_benchmark_signal: 0.82
  docs_change_signal: 0.70
  competitor_update: 0.78
  market_signal: 0.68
  policy_signal: 0.90
  expert_opinion: 0.62
  team_update: 0.70
  noise: 0.10

thresholds:
  action_required: 88
  alert: 80
  save: 45

priority_floor:
  enabled: true
  official_only: true
  categories:
    - dependency_update
    - security_supply_chain
  terms:
    - cve
    - vulnerability
    - supply chain
  min_score: 80

feedback_adjustments:
  useful: 5
  not_useful: -4
  false_positive: -8
  missed_signal: 8
  too_generic: -3

enabled_tools:
  - github_signal
  - package_registry
  - rss_signal
  - web_change
  - signal_memory
  - signal_score
  - report_writer

disabled_tools:
  - bash
  - write_file
  - edit_file
  - notebook_edit
  - web_search
  - web_fetch
  - mcp
  - list_mcp_resources
  - read_mcp_resource
  - agent
  - task_create
  - cron_create
  - create_github_issue

permission_policy:
  auto_allow:
    - read_github_release
    - read_github_issue
    - read_package_registry
    - read_rss
    - read_mock_web_change
    - read_web_change
    - read_config
    - read_project_context
    - read_signal_history
    - read_assessments
    - read_run_trace
    - read_feedback_memory
    - write_local_report
    - write_task_trace
  require_confirmation:
    - modify_signal_policy
    - add_watchlist_source
    - remove_watchlist_source
    - create_github_issue
    - send_team_notification
    - modify_project_profile
