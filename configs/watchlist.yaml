local_git:
  repositories:
    - name: SignalHarness
      path: .

github:
  repositories:
    - repo: pocketvin/signalharness
      project_owned: true
      events:
        - commits
        - pull_requests
    - repo: langchain-ai/langgraph
      package_name: langgraph
      package_registry: pypi
      events:
        - releases
        - issues
    - repo: openai/openai-python
      package_name: openai
      package_registry: pypi
      events:
        - releases
        - issues
    - repo: pydantic/pydantic
      package_name: pydantic
      package_registry: pypi
      events:
        - releases
        - issues
package_registries:
  pypi:
    packages:
      - name: mcp
      - name: fastapi
      - name: pydantic

security:
  osv:
    enabled: true

rss:
  feeds:
    - name: OpenAI News
      official: true
      url: https://openai.com/news/rss.xml
    - name: GitHub Changelog
      official: true
      url: https://github.blog/changelog/feed/
    - name: GitHub Engineering
      official: true
      url: https://github.blog/engineering/feed/
    - name: GitHub Security
      official: true
      url: https://github.blog/security/feed/
    - name: Simon Willison
      official: false
      url: https://simonwillison.net/atom/everything/

web_changes:
  sources:
    - name: MCP Specification
      adapter: http
      url: https://modelcontextprotocol.io/specification/latest
      official: true
      entity_type: protocol
      entity_name: Model Context Protocol
